name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill
        run: python tests/validate_skill.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check install targets
        run: python install.py --list

      - name: Check dry run
        run: python install.py --target project --dry-run
